name: Laravel CI/CD Testing

on:
  push:
    branches:
      - dev # Hanya berjalan saat push ke branch dev
  pull_request:
    branches:
      - dev

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: laravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laravel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo, xml, ctype, json, bcmath, fileinfo, pgsql
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Environment for Testing
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Set Up Database
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 103.181.142.20
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: postgres
          DB_PASSWORD: kp3_admin291
        # run: php artisan migrate --force

      - name: Run Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 103.181.142.20
          DB_PORT: 5432
          DB_DATABASE: laravel_test
          DB_USERNAME: postgres
          DB_PASSWORD: kp3_admin291
        # run: php artisan test

  deploy:
    needs: laravel-tests
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/html/ci_cd  # Sesuaikan dengan path project di server
            git pull origin dev
            composer install --no-dev --no-interaction --prefer-dist
            php artisan config:clear
            php artisan cache:clear
            php artisan view:clear
            php artisan route:cache
            php artisan config:cache
            php artisan queue:restart
            php artisan storage:link
            chmod -R 775 storage bootstrap/cache
            sudo systemctl restart apache2
